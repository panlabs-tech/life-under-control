name: pr-checks

# Portão 2 — o gate real antes do merge na main. O portão 1 é local
# (`lefthook.yml`) e o portão 3 é o deploy (`deploy.yml`).
#
# Este arquivo é um **caller** da CI compartilhada de `panlabs-tech/.github`,
# e não mais uma cópia de YAML: os quatro arquivos de CI da frota nasceram
# copiados um do outro e divergiram entre 48% e 86% em sete semanas, então
# origem comum não impede deriva -- só a referência impede.
#
# O contrato de nomes de status: `checks` (o rollup) e `security` são os dois
# required checks da org inteira, de nome fixo. As pernas por superfície
# (`checks-python`, `checks-node`) variam repo a repo; o nome publicado, não.
# Ver `scripts/panlabs/ci/rollup.py` no repo `.github`.
#
# **As duas pernas de checks são locais, e isso é decisão registrada, não
# preguiça.** Elas precisam de Postgres e MinIO como `services`, e o bloco
# `services` de um job não é parametrizável por input num reusable workflow:
# não existe forma de passar serviços como argumento do `workflow_call`. O
# `checks-python.yml` compartilhado documenta essa exceção nominalmente, por
# este repo. O que é compartilhado aqui é o que dá para compartilhar: o scan de
# segredos e a abertura do PR.
#
# A referência é pinada numa tag exata (`@v1.0.0`), nunca numa flutuante: uma
# tag flutuante reintroduziria a quebra simultânea de todos os consumidores que
# o versionamento existe para evitar. O Dependabot bumpa a tag por PR revisável
# quando o `.github` cortar uma nova.
#
# As guardas de "pula em verde enquanto o app não existe" saíram junto com o
# pré-protótipo: as duas aplicações existem, e uma perna que se pula sozinha é
# a mesma falha que a anatomia nomeia na perna que não está declarada -- sai
# verde sem ter rodado nada.

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"
      - "ci/**"
      - "worktree/**"
      # A ferramenta EnterWorktree do Claude Code gera branch com hífen
      # (worktree-<nome>), não com barra: sem esta linha o push de uma branch
      # de agente não dispara checagem nenhuma.
      - "worktree-**"
      # A raiz de branch do Dependabot, que não é configurável. Sem ela o PR do
      # bot não dispara checagem nenhuma e os required checks nunca saem.
      - "dependabot/**"

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- as pernas por superfície ---------------------------------------------

  # Superfície Node (`apps/web`). Postgres real porque os testes de adapter
  # Drizzle falam com banco de verdade; os demais passos ignoram o serviço.
  checks-node:
    name: checks-node
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: luc
          POSTGRES_PASSWORD: luc
          POSTGRES_DB: luc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O binário direto, e não `pnpm exec biome`: aquele sai verde sem ter
      # verificado nada quando o filtro não casa (falso-verde registrado no
      # `AGENTS.md`).
      - name: lint (biome)
        run: node_modules/.bin/biome check apps/web
      - name: typecheck (tsc)
        run: pnpm --filter @luc/web typecheck
      - name: test (vitest)
        env:
          DATABASE_URL: postgres://luc:luc@localhost:5432/luc
        run: pnpm --filter @luc/web test

  # Superfície Python (`apps/api`). Postgres para as fatias de repositório e o
  # boot do Alembic; MinIO para o `R2AttachmentStore`.
  checks-python:
    name: checks-python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: luc
          POSTGRES_PASSWORD: luc
          POSTGRES_DB: luc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # MinIO real, a mesma imagem do `docker-compose.yml` local. O schema
      # `services:` do GitHub Actions não passa `command:` para o container, e
      # essa imagem exige `server /data` como args para subir: daí o `docker
      # run` manual em vez de `services:`.
      - name: start minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=lucminio \
            -e MINIO_ROOT_PASSWORD=lucminio123 \
            minio/minio server /data
          until curl -sf http://localhost:9000/minio/health/live; do
            echo "aguardando o MinIO..."; sleep 1
          done
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - working-directory: apps/api
        run: uv sync --frozen
      - name: format (ruff)
        working-directory: apps/api
        run: uv run --frozen ruff format --check .
      - name: lint (ruff)
        working-directory: apps/api
        run: uv run --frozen ruff check .
      - name: types (pyright)
        working-directory: apps/api
        run: uv run --frozen pyright
      - name: imports (import-linter)
        working-directory: apps/api
        run: uv run --frozen lint-imports
      - name: test (pytest)
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://luc:luc@localhost:5432/luc
          R2_ENDPOINT: http://localhost:9000
          R2_ACCESS_KEY_ID: lucminio
          R2_SECRET_ACCESS_KEY: lucminio123
          R2_BUCKET: luc-attachments-test
        run: uv run --frozen pytest

  # --- o contrato de nomes de status ----------------------------------------

  # O rollup: id fixo, `needs` sobre as pernas por superfície deste repo.
  # `if: always()` mais a checagem explícita do resultado, porque sem os dois
  # uma perna reprovada faria o rollup ser **pulado** em vez de reprovado, e
  # pulado não bloqueia o merge do jeito que reprovado faz. É o mesmo cálculo
  # que `panlabs.ci.rollup.rollup_conclusion` faz em Python, testado lá.
  checks:
    name: checks
    needs: [checks-node, checks-python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: agregar o resultado das pernas por superfície
        run: |
          set -euo pipefail
          for leg in "checks-node:${{ needs.checks-node.result }}" \
                     "checks-python:${{ needs.checks-python.result }}"; do
            name="${leg%%:*}"
            result="${leg#*:}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::${name} reprovou (${result})."
              exit 1
            fi
          done

  security-scan:
    uses: panlabs-tech/.github/.github/workflows/security.yml@v1.0.0

  # Job de fachada em volta de `security-scan`, não um rollup de superfícies.
  # Existe porque um job que chama um reusable workflow via `uses:` publica o
  # check como "<job do caller> / <job do workflow chamado>", nunca só com o
  # nome do job do caller -- comportamento do GitHub Actions, sem opção para
  # suprimir. Sem esta fachada o required check `security` nunca existiria com
  # esse nome exato.
  security:
    name: security
    needs: [security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: agregar o resultado do scan
        run: |
          set -euo pipefail
          result="${{ needs.security-scan.result }}"
          if [[ "$result" != "success" && "$result" != "skipped" ]]; then
            echo "::error::security-scan reprovou (${result})."
            exit 1
          fi

  # --- a esteira -------------------------------------------------------------

  # Padronizado, mas deliberadamente **não** required: exigi-lo como condição de
  # merge seria circular, porque é o job que cria o PR. O Dependabot já abre o
  # próprio PR, então rodar aqui na branch dele seria ruído no melhor caso e
  # corrida no pior.
  open-pr:
    needs: [checks, security]
    if: github.actor != 'dependabot[bot]'
    uses: panlabs-tech/.github/.github/workflows/open-pr.yml@v1.0.0
    permissions:
      contents: read
      pull-requests: write
